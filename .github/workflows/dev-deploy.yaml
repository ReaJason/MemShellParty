name: "Dev Deploy"

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**/*.png'

jobs:
  build-jar:
    name: Build Jar
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web with Bun
        working-directory: web
        run: bun install --frozen-lockfile && bun run build

      - name: Build Boot with Gradle (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :memshell-party-boot:test :memshell-party-boot:bootjar

      - name: Build Boot with Gradle (Windows)
        if: matrix.os == 'windows-latest'
        run: ./gradlew.bat :memshell-party-boot:test :memshell-party-boot:bootjar

      - name: Upload Boot Jar (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: boot
          path: memshell-party-boot/build/libs/*.jar

      - name: Build Desktop GUI with Gradle (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :memshell-party-gui:memshell-party-gui-app:shadowJar

      - name: Upload Desktop GUI Jar (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-gui
          # 只要全量包：-plain.jar 是 application 插件用的空壳（一个入口类）
          path: |
            memshell-party-gui/memshell-party-gui-app/build/libs/memshell-party-gui-*.jar
            !memshell-party-gui/memshell-party-gui-app/build/libs/*-plain.jar
          retention-days: 7

      - name: Build Woodpecker Plugin with Gradle (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :memshell-party-gui:memshell-party-gui-woodpecker:shadowJar

      - name: Upload Woodpecker Plugin Jar (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: woodpecker-plugin
          path: memshell-party-gui/memshell-party-gui-woodpecker/build/libs/memshell-party-woodpecker-*.jar
          retention-days: 7

      - name: Build Godzilla Plugin with Gradle (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :memshell-party-gui:memshell-party-gui-godzilla-plugin:shadowJar

      - name: Upload Godzilla Plugin Jar (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: godzilla-plugin
          path: memshell-party-gui/memshell-party-gui-godzilla-plugin/build/libs/memshell-party-godzilla-*.jar
          retention-days: 7

  docker-push:
    name: Docker Push
    needs: [ build-jar ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Boot Jar
        uses: actions/download-artifact@v8
        with:
          name: boot
          path: memshell-party-boot/build/libs

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: memshell-party-boot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/reajason/memshell-party:dev

  # 只有发布产物同源的改动才发新快照：boot/gui 发行物、vul、docker 的改动不触发
  changes:
    name: Detect Publishable Changes
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.filter.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before='HEAD~1'
          fi
          pattern='^(memshell-party-(api|core|common|packer)/|memshell-party-stub/|memshell-party-server/|memshell-party-shelltool/|memshell-party-gui/memshell-party-gui-sdk/|build-logic/|gradle/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|gradlew(\.bat)?$|\.github/scripts/publish_maven_central\.sh$|\.github/workflows/dev-deploy\.yaml$)'
          if git diff --name-only "$before" HEAD | grep -qE "$pattern"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-maven:
    name: Deploy to Maven Central
    needs: [ build-jar, changes ]
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish with Gradle
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        # 上传阶段偶发 401（同批其余文件正常），maven-publish 不重试，见脚本内说明
        run: .github/scripts/publish_maven_central.sh

  deploy-northflank:
    name: Deploy to Northflank
    needs: [ docker-push ]
    runs-on: ubuntu-latest
    env:
      NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
    steps:
      - name: Update Deployment
        run: |
          curl --header "Content-Type: application/json" \
               --header "Authorization: Bearer $NORTHFLANK_API_KEY" \
               --request POST \
               --data '{"external":{"imagePath":"docker.io/reajason/memshell-party:dev","credentials":"docker-hub"},"docker":{"configType":"default"}}' \
               https://api.northflank.com/v1/projects/memshellparty/services/prereleasememshellparty/deployment
