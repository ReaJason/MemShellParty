name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  info:
    name: Parse release info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version-without-v: ${{ steps.get_version.outputs.version-without-v }}
      changelog: ${{ steps.get_changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6

      - name: Get Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_WITHOUT_V=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version-without-v=$VERSION_WITHOUT_V" >> $GITHUB_OUTPUT

      - name: Get ChangeLog
        id: get_changelog
        working-directory: .github/scripts
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$(python parse_changelog_of_version.py ${{ steps.get_version.outputs.version }})" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-jar:
    name: Build Jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web with Bun
        working-directory: web
        run: bun install --frozen-lockfile && bun run build

      - name: Build Boot with Gradle
        run: ./gradlew :memshell-party-boot:bootjar -x test

      - name: Upload Boot Jar
        uses: actions/upload-artifact@v7
        with:
          name: boot
          path: memshell-party-boot/build/libs/*.jar

      - name: Build Desktop GUI with Gradle
        run: ./gradlew :memshell-party-gui:memshell-party-gui-app:shadowJar -x test

      - name: Upload Desktop GUI Jar
        uses: actions/upload-artifact@v7
        with:
          name: desktop-gui
          # 只要全量包：-plain.jar 是 application 插件用的空壳（一个入口类）
          path: |
            memshell-party-gui/memshell-party-gui-app/build/libs/memshell-party-gui-*.jar
            !memshell-party-gui/memshell-party-gui-app/build/libs/*-plain.jar

      - name: Build Woodpecker Plugin with Gradle
        run: ./gradlew :memshell-party-gui:memshell-party-gui-woodpecker:shadowJar -x test

      - name: Upload Woodpecker Plugin Jar
        uses: actions/upload-artifact@v7
        with:
          name: woodpecker-plugin
          path: memshell-party-gui/memshell-party-gui-woodpecker/build/libs/memshell-party-woodpecker-*.jar

      - name: Build Godzilla Plugin with Gradle
        run: ./gradlew :memshell-party-gui:memshell-party-gui-godzilla-plugin:shadowJar -x test

      - name: Upload Godzilla Plugin Jar
        uses: actions/upload-artifact@v7
        with:
          name: godzilla-plugin
          path: memshell-party-gui/memshell-party-gui-godzilla-plugin/build/libs/memshell-party-godzilla-*.jar

      - name: Build Shiro Exploit Jar with Gradle
        run: ./gradlew :memshell-party-gui:memshell-party-gui-shiro-exploit:shadowJar -x test

      - name: Upload Shiro Exploit Jar
        uses: actions/upload-artifact@v7
        with:
          name: shiro-exploit
          # 只要全量包：-plain.jar 是 application 插件用的空壳（一个入口类）
          path: |
            memshell-party-gui/memshell-party-gui-shiro-exploit/build/libs/memshell-party-shiro-exploit-*.jar
            !memshell-party-gui/memshell-party-gui-shiro-exploit/build/libs/*-plain.jar

      - name: Build FR Exploit Jar with Gradle
        run: ./gradlew :memshell-party-gui:memshell-party-gui-fr-exploit:shadowJar -x test

      - name: Upload FR Exploit Jar
        uses: actions/upload-artifact@v7
        with:
          name: fr-exploit
          # 只要全量包：-plain.jar 是 application 插件用的空壳（一个入口类）
          path: |
            memshell-party-gui/memshell-party-gui-fr-exploit/build/libs/memshell-party-fr-exploit-*.jar
            !memshell-party-gui/memshell-party-gui-fr-exploit/build/libs/*-plain.jar

      - name: Build Custom GUI Example with Gradle
        run: ./gradlew :memshell-party-examples:memshell-party-example-custom-gui:shadowJar -x test

      - name: Upload Custom GUI Example Jar
        uses: actions/upload-artifact@v7
        with:
          name: custom-gui
          # 只要全量包：-plain.jar 是 application 插件用的空壳（一个入口类）
          path: |
            memshell-party-examples/memshell-party-example-custom-gui/build/libs/memshell-party-custom-gui-*.jar
            !memshell-party-examples/memshell-party-example-custom-gui/build/libs/*-plain.jar

  docker-push:
    name: Docker Push
    needs: [ info, build-jar ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Boot Jar
        uses: actions/download-artifact@v4
        with:
          name: boot
          path: memshell-party-boot/build/libs

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: memshell-party-boot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/reajason/memshell-party:${{ needs.info.outputs.version-without-v }}
            docker.io/reajason/memshell-party:latest
            ghcr.io/reajason/memshell-party:${{ needs.info.outputs.version-without-v }}
            ghcr.io/reajason/memshell-party:latest

      - name: Build and push RedQueen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            ROUTE_ROOT_PATH=/redqueen-memshell-party
            CONTEXT_PATH=/redqueen-memshell-party
          push: true
          tags: |
            docker.io/reajason/memshell-party:redqueen

  deploy-maven:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish with Gradle
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        # 上传阶段偶发 401（同批其余文件正常），maven-publish 不重试，见脚本内说明
        run: .github/scripts/publish_maven_central.sh

  create-release:
    name: Create Release
    needs: [ info, docker-push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Boot Jar
        uses: actions/download-artifact@v4
        with:
          name: boot
          path: memshell-party-boot/build/libs

      - name: Download Desktop GUI Jar
        uses: actions/download-artifact@v4
        with:
          name: desktop-gui
          path: memshell-party-gui/memshell-party-gui-app/build/libs

      - name: Download Woodpecker Plugin Jar
        uses: actions/download-artifact@v4
        with:
          name: woodpecker-plugin
          path: memshell-party-gui/memshell-party-gui-woodpecker/build/libs

      - name: Download Godzilla Plugin Jar
        uses: actions/download-artifact@v4
        with:
          name: godzilla-plugin
          path: memshell-party-gui/memshell-party-gui-godzilla-plugin/build/libs

      - name: Download Shiro Exploit Jar
        uses: actions/download-artifact@v4
        with:
          name: shiro-exploit
          path: memshell-party-gui/memshell-party-gui-shiro-exploit/build/libs

      - name: Download FR Exploit Jar
        uses: actions/download-artifact@v4
        with:
          name: fr-exploit
          path: memshell-party-gui/memshell-party-gui-fr-exploit/build/libs

      - name: Download Custom GUI Example Jar
        uses: actions/download-artifact@v4
        with:
          name: custom-gui
          path: memshell-party-examples/memshell-party-example-custom-gui/build/libs

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.info.outputs.version }}
          tag: ${{ needs.info.outputs.version }}
          body: ${{ needs.info.outputs.changelog }}
          artifacts: |
            memshell-party-boot/build/libs/memshell-party-boot-${{ needs.info.outputs.version-without-v }}.jar
            memshell-party-gui/memshell-party-gui-app/build/libs/memshell-party-gui-${{ needs.info.outputs.version-without-v }}.jar
            memshell-party-gui/memshell-party-gui-woodpecker/build/libs/memshell-party-woodpecker-${{ needs.info.outputs.version-without-v }}.jar
            memshell-party-gui/memshell-party-gui-godzilla-plugin/build/libs/memshell-party-godzilla-${{ needs.info.outputs.version-without-v }}.jar
            memshell-party-gui/memshell-party-gui-shiro-exploit/build/libs/memshell-party-shiro-exploit-${{ needs.info.outputs.version-without-v }}.jar
            memshell-party-gui/memshell-party-gui-fr-exploit/build/libs/memshell-party-fr-exploit-${{ needs.info.outputs.version-without-v }}.jar
            memshell-party-examples/memshell-party-example-custom-gui/build/libs/memshell-party-custom-gui-${{ needs.info.outputs.version-without-v }}.jar

  deploy-northflank:
    name: Deploy to Northflank
    needs: [ docker-push ]
    runs-on: ubuntu-latest
    env:
      NORTHFLANK_API_KEY: ${{ secrets.NORTHFLANK_API_KEY }}
    steps:
      - name: Update Deployment
        run: |
          curl --header "Content-Type: application/json" \
               --header "Authorization: Bearer $NORTHFLANK_API_KEY" \
               --request POST \
               --data '{"external":{"imagePath":"docker.io/reajason/memshell-party:latest","credentials":"docker-hub"},"docker":{"configType":"default"}}' \
               https://api.northflank.com/v1/projects/memshellparty/services/memshellparty/deployment
