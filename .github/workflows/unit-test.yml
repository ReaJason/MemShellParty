name: Unit-Test

on:
  push:
    branches:
      - '**'
    paths:
      - 'memshell-party-common/**'
      - 'memshell-party-api/**'
      - 'memshell-party-core/**'
      - 'memshell-party-server/**'
      - 'memshell-party-shelltool/**'
      - 'memshell-party-stub/**'
      - 'memshell-party-packer/**'
      - 'memshell-party-boot/**'
      - 'memshell-party-gui/**'
      - 'memshell-party-examples/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/unit-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: UniteTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Common Unit Test with Gradle
        run: ./gradlew :memshell-party-common:test

      - name: Core Unit Test with Gradle
        run: ./gradlew :memshell-party-core:test

      - name: Provider Unit Test with Gradle
        run: >
          ./gradlew
          :memshell-party-server:memshell-party-server-tomcat:test
          :memshell-party-shelltool:memshell-party-shelltool-godzilla:test
          :memshell-party-shelltool:memshell-party-shelltool-command:test
          :memshell-party-shelltool:memshell-party-shelltool-antsword:test
          :memshell-party-shelltool:memshell-party-shelltool-behinder:test

      - name: Packer Unit Test with Gradle
        run: ./gradlew :memshell-party-packer:test

      - name: GUI Unit Test with Gradle
        run: >
          ./gradlew
          :memshell-party-gui:memshell-party-gui-sdk:test
          :memshell-party-gui:memshell-party-gui-app:test
          :memshell-party-gui:memshell-party-gui-woodpecker:test
          :memshell-party-gui:memshell-party-gui-godzilla-plugin:test
          :memshell-party-gui:memshell-party-gui-shiro-exploit:test
          :memshell-party-gui:memshell-party-gui-fr-exploit:test

      - name: Boot Unit Test with Gradle
        run: ./gradlew :memshell-party-boot:test

      - name: Example Tests with Gradle
        run: >
          ./gradlew
          :memshell-party-examples:memshell-party-example-custom-gui:test
          :memshell-party-examples:memshell-party-example-probe:test

      - name: Unit Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          check_name: 'Unit Test Report'
          report_paths: '**/build/test-results/test/TEST-*.xml'
